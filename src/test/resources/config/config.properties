# ---------------------------------------------------------------------------
# Default (committed) configuration.
#
# Every key can be overridden, highest priority first, by:
#   1. JVM / Maven system property:   mvn test -Dpetstore.base.url=http://localhost:8080
#   2. Environment variable:          PETSTORE_BASE_URL=http://localhost:8080  (dots -> underscores, upper case)
#   3. config/config.local.properties (git-ignored; copy config.local.properties.example)
# ---------------------------------------------------------------------------

# API under test
petstore.base.url=https://petstore.swagger.io
petstore.base.path=/v2
# Public demo key documented by the Petstore itself - not a secret
petstore.api.key=special-key

# Read-after-write polling on the shared public server
consistency.timeout.seconds=15
consistency.poll.interval.millis=500
