# Runs the full API suite against the public Petstore on every push / pull request
# and publishes the Allure and Cucumber reports as build artifacts.
name: api-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API tests
        run: ./mvnw -B -ntp clean test

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -ntp allure:report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/site/allure-maven-plugin/
            target/cucumber-reports/
